name: "publish"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # First job: Check if a draft release exists, create one if not
  check-or-create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.get_or_create_release.outputs.release_id }}
      release_upload_url: ${{ steps.get_or_create_release.outputs.release_upload_url }}
      tag_name: ${{ steps.get_or_create_release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v6

      - name: Get app version
        id: get_version
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          TAG_NAME="aurabox-bounce-v$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Get or create release
        id: get_or_create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.get_version.outputs.tag_name }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Check if a draft release with this tag already exists
          RELEASES=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100")
          
          RELEASE_ID=$(echo "$RELEASES" | jq -r ".[] | select(.draft == true and .tag_name == \"$TAG_NAME\") | .id")
          
          # If no release exists, create one
          if [ -z "$RELEASE_ID" ]; then
            echo "Creating a new draft release..."
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG_NAME\", \"name\":\"Aurabox Bounce v$VERSION\", \"body\":\"See the assets to download this version and install.\", \"draft\":true}" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
          
            RELEASE_ID=$(echo "$RESPONSE" | jq -r ".id")
            UPLOAD_URL=$(echo "$RESPONSE" | jq -r ".upload_url")
          else
            echo "Using existing draft release with ID: $RELEASE_ID"
            UPLOAD_URL=$(echo "$RELEASES" | jq -r ".[] | select(.id == $RELEASE_ID) | .upload_url")
          fi
          
          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "release_upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

  # Second job: Build and publish the app for all platforms
  publish-tauri:
    needs: check-or-create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            name: "macOS-arm64"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
            name: "macOS-intel"
          - platform: "ubuntu-22.04"
            target: ""
            name: "linux"
          - platform: "windows-latest"
            target: ""
            name: "windows"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: yarn install

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify certificate
        if: matrix.platform == 'macos-latest'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ secrets.TAURI_SIGNING_PUBLIC_KEY }}
        with:
          tagName: ${{ needs.check-or-create-release.outputs.tag_name }}
          releaseName: "Aurabox Bounce v__VERSION__"
          releaseId: ${{ needs.check-or-create-release.outputs.release_id }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          # tauri-action's built-in latest.json is unreliable for multi-platform
          # universal builds; the publish-updater-manifest job assembles it.
          includeUpdaterJson: false
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Per-platform updater signatures collected by the manifest job below.

      - name: Stash macOS-arm64 signature
        if: matrix.platform == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: sig-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Stash macOS-intel signature
        if: matrix.platform == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: sig-macos-intel
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Stash Linux signature
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: sig-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

      - name: Stash Windows signature
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: sig-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish-updater-manifest:
    needs: [check-or-create-release, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS arm64 signature
        uses: actions/download-artifact@v4
        with:
          name: sig-macos-arm64
          path: sigs/macos-arm64

      - name: Download macOS intel signature
        uses: actions/download-artifact@v4
        with:
          name: sig-macos-intel
          path: sigs/macos-intel

      - name: Download Linux signature
        uses: actions/download-artifact@v4
        with:
          name: sig-linux
          path: sigs/linux

      - name: Download Windows signature
        uses: actions/download-artifact@v4
        with:
          name: sig-windows
          path: sigs/windows

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-or-create-release.outputs.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          DARWIN_ARM_FILE=$(basename "$(ls sigs/macos-arm64/*.app.tar.gz.sig)" .sig)
          DARWIN_X86_FILE=$(basename "$(ls sigs/macos-intel/*.app.tar.gz.sig)" .sig)
          LINUX_FILE=$(basename "$(ls sigs/linux/*.AppImage.sig)" .sig)
          WINDOWS_FILE=$(basename "$(ls sigs/windows/*-setup.exe.sig)" .sig)

          DARWIN_ARM_SIG=$(cat sigs/macos-arm64/*.app.tar.gz.sig)
          DARWIN_X86_SIG=$(cat sigs/macos-intel/*.app.tar.gz.sig)
          LINUX_SIG=$(cat sigs/linux/*.AppImage.sig)
          WINDOWS_SIG=$(cat sigs/windows/*-setup.exe.sig)

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --arg darwin_arm_sig "$DARWIN_ARM_SIG" \
            --arg darwin_arm_url "${BASE_URL}/${DARWIN_ARM_FILE}" \
            --arg darwin_x86_sig "$DARWIN_X86_SIG" \
            --arg darwin_x86_url "${BASE_URL}/${DARWIN_X86_FILE}" \
            --arg linux_sig "$LINUX_SIG" \
            --arg linux_url "${BASE_URL}/${LINUX_FILE}" \
            --arg windows_sig "$WINDOWS_SIG" \
            --arg windows_url "${BASE_URL}/${WINDOWS_FILE}" \
            '{
              version: $version,
              notes: "See the release page for details.",
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $darwin_arm_sig, url: $darwin_arm_url },
                "darwin-x86_64":  { signature: $darwin_x86_sig, url: $darwin_x86_url },
                "linux-x86_64":   { signature: $linux_sig,      url: $linux_url },
                "windows-x86_64": { signature: $windows_sig,    url: $windows_url }
              }
            }' > latest.json

          cat latest.json
          gh release upload "$TAG" latest.json#latest.json --clobber --repo "$REPO"
